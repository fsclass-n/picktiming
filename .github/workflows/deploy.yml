name: Deploy

# main에 push되면 CI 전체를 통과한 뒤, "바뀐 폴더"에 해당하는 대상에만 배포한다.
#
#   바뀐 경로                         Netlify   Render   EC2(full)   EC2(rpa-only)
#   frontend/                          O         O        O           -
#   netlify.toml                       O         -        -           -
#   backend/                           -         O        O (api)     -
#   render.yaml, .dockerignore         -         O        -           -
#   rpa/                               -         -        O (rpa)     O
#   docker-compose.yml, deploy/        -         -        O           O(compose만)
#
#   Netlify       : 프런트엔드 전용(데모 모드)
#   Render        : 분리 배포(render.yaml). frontend/ → Static Site(timepick), backend/ → Web Service(timepick-ai, backend/Dockerfile)
#                   각 서비스의 Build Filter가 자기 경로만 배포한다. 가격 수집은 collect-render.yml
#                   기본은 Render Auto-Deploy "After CI Checks Pass"(이 워크플로의 CI 통과 후 Render가 직접 배포)라
#                   RENDER_DEPLOY_HOOK_URL을 등록하지 않으며 아래 render 작업은 건너뛴다. Auto-Deploy를 Off로 둘 때만 Hook을 등록.
#   EC2(full)     : EC2에서 nginx + api + rpa 전체 스택 운영 (기본값)
#   EC2(rpa-only) : API는 Render, EC2는 RPA 수집기만 운영  → Variable EC2_MODE=rpa-only
#   비교 기준 커밋이 없으면(첫 push, 강제 push) 모든 대상에 배포한다.
#   수동 실행(workflow_dispatch)은 선택한 대상에 전체 배포한다.
#
# 필요한 값을 등록하지 않은 대상은 건너뛴다.
#   Secrets:   RENDER_DEPLOY_HOOK_URL, EC2_HOST, EC2_USER, EC2_SSH_KEY, NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
#   Variables: RENDER_HEALTH_URL, EC2_APP_DIR(기본 ~/timepick), EC2_MODE(full | rpa-only), API_BASE_URL

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      netlify:
        description: Netlify(프런트엔드) 배포
        type: boolean
        default: true
      render:
        description: Render(API) 배포
        type: boolean
        default: true
      ec2:
        description: EC2 배포
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  changes:
    name: 변경 경로 판별
    runs-on: ubuntu-24.04
    outputs:
      netlify: ${{ steps.diff.outputs.netlify }}
      render: ${{ steps.diff.outputs.render }}
      ec2: ${{ steps.diff.outputs.ec2 }}
      ec2_all: ${{ steps.diff.outputs.ec2_all }}
      ec2_services: ${{ steps.diff.outputs.ec2_services }}
      ec2_web: ${{ steps.diff.outputs.ec2_web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          EC2_MODE: ${{ vars.EC2_MODE || 'full' }}
          IN_NETLIFY: ${{ inputs.netlify }}
          IN_RENDER: ${{ inputs.render }}
          IN_EC2: ${{ inputs.ec2 }}
        run: bash .github/scripts/detect-changes.sh

  render:
    name: Render (FastAPI)
    needs: [ci, changes]
    if: needs.changes.outputs.render == 'true'
    runs-on: ubuntu-24.04
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      HEALTH: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - name: Deploy Hook 호출
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null && echo "Render 배포를 요청했습니다."
      - name: 헬스 체크 대기
        if: env.HOOK != '' && env.HEALTH != ''
        run: |
          sleep 60
          for i in $(seq 1 30); do curl -fsS "$HEALTH" && exit 0; sleep 10; done
          echo "Render 헬스 체크 실패"; exit 1
      - name: 건너뜀 안내
        if: env.HOOK == ''
        run: echo "RENDER_DEPLOY_HOOK_URL secret이 없어 Render 배포를 건너뜁니다."

  ec2:
    name: AWS EC2 (docker compose)
    # API(Render)를 먼저 배포한 뒤 RPA를 배포한다 (Render 배포가 없거나 건너뛴 경우에도 진행)
    needs: [ci, changes, render]
    if: >-
      !cancelled() && needs.ci.result == 'success' && needs.changes.outputs.ec2 == 'true' &&
      (needs.render.result == 'success' || needs.render.result == 'skipped')
    runs-on: ubuntu-24.04
    env:
      HOST: ${{ secrets.EC2_HOST }}
      EC2_LOGIN: ${{ secrets.EC2_USER }}   # 비어 있으면 ubuntu(Ubuntu AMI 기본). 쉘 변수 USER와 섞이지 않게 이름을 따로 둔다
      KEY: ${{ secrets.EC2_SSH_KEY }}
      APP_DIR: ${{ vars.EC2_APP_DIR || '~/timepick' }}
      EC2_MODE: ${{ vars.EC2_MODE || 'full' }}
      ALL: ${{ needs.changes.outputs.ec2_all }}
      SERVICES: ${{ needs.changes.outputs.ec2_services }}
      WEB: ${{ needs.changes.outputs.ec2_web }}
    steps:
      - name: SSH 키 준비
        if: env.HOST != ''
        run: |
          # Secret 값에 섞인 공백·줄바꿈·http(s):// 를 정리한다(값 자체는 로그에 남기지 않음)
          host="$(printf '%s' "$HOST" | tr -d '[:space:]' | sed -E 's#^[a-z]+://##; s#/.*$##; s#^.*@##')"
          login="$(printf '%s' "${EC2_LOGIN:-ubuntu}" | tr -d '[:space:]')"; login="${login:-ubuntu}"
          case "$login$host" in -*) echo "::error::EC2_USER/EC2_HOST가 '-'로 시작할 수 없습니다"; exit 1 ;; esac
          [ -n "$host" ] || { echo "::error::EC2_HOST가 비어 있습니다"; exit 1; }
          echo "TARGET=$login@$host" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/ec2.pem && chmod 600 ~/.ssh/ec2.pem
          ssh-keygen -y -f ~/.ssh/ec2.pem > /dev/null || { echo "::error::EC2_SSH_KEY가 올바른 개인 키(.pem 전체 내용)가 아닙니다"; exit 1; }
          ssh-keyscan -T 15 -H "$host" >> ~/.ssh/known_hosts || { echo "::error::$host:22에 연결할 수 없습니다(보안 그룹 22번·도메인 IP 확인)"; exit 1; }
      - name: 서버 준비 (처음 1회 자동 — Docker 설치·저장소 클론, EC2_ENV_FILE이 있으면 .env 갱신)
        if: env.HOST != ''
        env:
          ENV_FILE: ${{ secrets.EC2_ENV_FILE }}   # 선택: 로컬 .env 전체 내용. 없으면 서버의 기존 .env를 그대로 쓴다
          REPO: https://github.com/${{ github.repository }}.git
        run: |
          ssh -i ~/.ssh/ec2.pem -o ConnectTimeout=20 "$TARGET" "APP_DIR='$APP_DIR' REPO='$REPO' bash -s" <<'BOOT'
          set -e
          dir="${APP_DIR/#\~/$HOME}"
          if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker.io docker-compose-v2 git curl
            sudo usermod -aG docker "$USER"
          fi
          # 메모리 3GB 미만이면 이미지 빌드용 스왑 2GB(한 번만)
          if [ "$(awk '/MemTotal/ {print $2}' /proc/meminfo)" -lt 3000000 ] && ! swapon --show | grep -q /swapfile; then
            sudo fallocate -l 2G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile >/dev/null && sudo swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null
          fi
          [ -d "$dir/.git" ] || git clone -q "$REPO" "$dir"
          BOOT
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" | tr -d '\r' | ssh -i ~/.ssh/ec2.pem "$TARGET" \
              "APP_DIR='$APP_DIR' bash -c 'd=\${APP_DIR/#\~/\$HOME}; umask 077; cat > \"\$d/.env\"'"
            echo ".env를 EC2_ENV_FILE secret으로 갱신했습니다."
          fi
          ssh -i ~/.ssh/ec2.pem "$TARGET" "APP_DIR='$APP_DIR' bash -c 'test -s \${APP_DIR/#\~/\$HOME}/.env'" \
            || { echo "::error::서버에 .env가 없습니다. EC2_ENV_FILE secret(로컬 .env 전체)을 등록하거나 scp로 복사하세요."; exit 1; }
      - name: 원격 배포 (git pull → 바뀐 서비스만 docker compose up)
        if: env.HOST != ''
        run: |
          echo "mode=$EC2_MODE all=$ALL services='$SERVICES' web=$WEB"
          ssh -i ~/.ssh/ec2.pem -o ConnectTimeout=20 -o ServerAliveInterval=30 "$TARGET" \
            "APP_DIR='$APP_DIR' MODE='$EC2_MODE' ALL='$ALL' SERVICES='$SERVICES' WEB='$WEB' DOMAIN='${TARGET#*@}' bash -s" <<'REMOTE'
          set -e
          cd "${APP_DIR/#\~/$HOME}"
          # 방금 docker 그룹에 추가된 경우 이 접속에는 아직 권한이 없다 → sudo로 실행
          docker() { if command docker info >/dev/null 2>&1; then command docker "$@"; else sudo docker "$@"; fi; }
          git pull --ff-only origin main
          port="$(grep -E '^WEB_PORT=' .env | tail -1 | cut -d= -f2 | tr -d '[:space:]')"
          # 서버에 OS용 nginx가 80번을 쓰고 있으면(다른 사이트일 수 있어 끄지 않음) 컨테이너는 8080에 띄우고,
          # 그 nginx에 timepick 도메인 전용 설정을 추가해 8080으로 넘긴다(다른 server_name 사이트는 그대로)
          if [ -z "$port" ] && sudo ss -ltnp 'sport = :80' | grep -q '"nginx"' && [ -z "$(docker ps -q --filter publish=80 --filter name=timepick-web)" ]; then
            port=8080
            conf=/etc/nginx/conf.d/timepick.conf
            printf '%s\n' "server {" "    listen 80;" "    listen [::]:80;" "    server_name $DOMAIN;" \
              "    client_max_body_size 10m;" "    location / {" "        proxy_pass http://127.0.0.1:$port;" \
              "        proxy_set_header Host \$host;" "        proxy_set_header X-Real-IP \$remote_addr;" \
              "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;" "        proxy_set_header X-Forwarded-Proto \$scheme;" \
              "        proxy_read_timeout 60s;" "    }" "}" | sudo tee "$conf.new" >/dev/null
            # 처음 한 번만 만든다. 이후 certbot(Let's Encrypt)이 이 파일에 443·리다이렉트를 추가하므로 덮어쓰지 않는다
            if [ ! -f "$conf" ]; then
              sudo mv "$conf.new" "$conf"
              sudo nginx -t && sudo systemctl reload nginx && echo "서버 nginx에 $DOMAIN → 127.0.0.1:$port 설정을 추가했습니다."
            else
              sudo rm -f "$conf.new"
            fi
          fi
          export WEB_PORT="${port:-80}"; port="$WEB_PORT"
          if [ "$MODE" = "rpa-only" ]; then
            docker compose up -d --build --no-deps rpa
          elif [ "$ALL" = "true" ]; then
            docker compose up -d --build --remove-orphans
          elif [ -n "$SERVICES" ]; then
            docker compose up -d --build --no-deps $SERVICES
          fi
          # nginx 설정(deploy/)은 바인드 마운트라 재시작해야 반영된다. frontend/ 파일은 git pull만으로 반영된다.
          if [ "$MODE" != "rpa-only" ] && [ "$WEB" = "true" ]; then
            docker compose up -d --no-deps web && docker compose restart web
          fi
          docker image prune -f > /dev/null
          if [ "$MODE" = "rpa-only" ]; then
            sleep 5; docker compose ps rpa --status running | grep -q rpa && exit 0
            docker compose logs --tail 50 rpa; exit 1
          fi
          for i in $(seq 1 30); do curl -fsS "http://localhost:$port/health" && exit 0; sleep 3; done
          docker compose logs --tail 50 api; exit 1
          REMOTE
      - name: 건너뜀 안내
        if: env.HOST == ''
        run: echo "EC2_HOST secret이 없어 EC2 배포를 건너뜁니다."

  netlify:
    name: Netlify (frontend)
    needs: [ci, changes]
    if: needs.changes.outputs.netlify == 'true'
    runs-on: ubuntu-24.04
    env:
      TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.TOKEN != '' && env.SITE != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 데모 모드로 빌드 후 zip 배포 (Netlify API)
        if: env.TOKEN != '' && env.SITE != ''
        working-directory: frontend
        run: |
          # Netlify는 데모 모드: VITE_API_URL을 넣지 않고 public/js/config.js(API_BASE_URL "")를 그대로 쓴다
          npm ci --no-audit --no-fund && npm run build
          grep -q 'API_BASE_URL: ""' dist/js/config.js || { echo "::error::config.js가 데모 모드가 아닙니다"; exit 1; }
          cd dist && zip -qr /tmp/site.zip .
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/zip" \
            --data-binary @/tmp/site.zip "https://api.netlify.com/api/v1/sites/$SITE/deploys" > /dev/null
          echo "Netlify 배포 완료"
      - name: 건너뜀 안내
        if: env.TOKEN == '' || env.SITE == ''
        run: echo "Netlify Git 연동(netlify.toml)으로 배포하거나 NETLIFY_AUTH_TOKEN/NETLIFY_SITE_ID secret을 등록하세요."
