# Render Blueprint: 프런트엔드(Static Site)와 백엔드(Web Service) 분리 배포. DB는 TiDB Cloud(MySQL 호환)를 DATABASE_URL로 연결한다.
#
#   timepick-api    (Web Service, Docker)  https://timepick-api.onrender.com  FastAPI API·AI·수집 수신. 화면 경로는 FRONTEND_URL로 리다이렉트
#   timepick        (Static Site)          https://timepick.onrender.com      React 빌드 결과(dist). VITE_API_URL로 위 API를 호출
#
# 운영 DB 이름은 timepick(2026-11-09 picktiming에서 변경). DATABASE_URL 경로가 다르면 Unknown database(1049)로 기동 실패.
# 주소를 바꾸면 GitHub Variable RENDER_URL, 소셜 로그인 콜백(Redirect URI)도 새 백엔드 주소로 바꾼다(docs/md/07-deploy-render.md).
# 이름이 이미 사용 중이면 Render가 다른 주소(예: timepick-xxxx.onrender.com)를 준다 → 실제 주소로 FRONTEND_URL·VITE_API_URL·ALLOWED_ORIGINS를 맞춘다.
# 배포: main에 커밋하면 GitHub Actions의 CI가 모두 통과한 뒤 Render가 자동 배포한다(After CI Checks Pass).
# 백엔드 비밀값은 로컬·EC2와 같은 .env를 대시보드 Environment → "Add from .env"로 붙여 넣는다.
# FRONTEND_URL·VITE_API_URL은 Render 전용 값이라 .env에 넣지 않는다(EC2는 nginx 같은 도메인 구성).
services:
  # ---------------------------------------------------------------- 백엔드: API 전용(backend/Dockerfile)
  - type: web
    name: timepick-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - requirements.txt
        - render.yaml
        - .dockerignore
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL          # 예: mysql+pymysql://USER:PASSWORD@HOST:4000/timepick?charset=utf8mb4
        sync: false
      - key: DB_SSL_CA             # TiDB Cloud TLS
        value: /etc/ssl/certs/ca-certificates.crt
      - key: JWT_SECRET            # 로컬·EC2와 같은 .env 값
        sync: false
      - key: RPA_API_KEY           # GitHub Secret RENDER_RPA_API_KEY와 같은 값
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_DAILY_LIMIT
        value: "20"
      - key: FRONTEND_URL          # Static Site 주소: CORS 자동 허용, 소셜 로그인 복귀, 화면 경로 리다이렉트
        value: https://timepick.onrender.com
      - key: ALLOWED_ORIGINS       # .env와 같은 값(FRONTEND_URL은 자동 추가되므로 빠져 있어도 동작)
        value: https://timepick.onrender.com,https://timepick-api.onrender.com,http://picktiming.duckdns.org,http://localhost:8000,http://localhost:5173
      - key: ADMIN_EMAILS
        sync: false
      - key: DEMO_LOGIN_ENABLED    # 로그인 화면의 테스트 계정 버튼
        value: "true"
      # 소셜 로그인(선택) — 값은 대시보드에서 입력. 비어 있으면 해당 버튼만 비활성. 콜백은 백엔드 주소(기존과 동일)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false

  # ---------------------------------------------------------------- 프런트엔드: 정적 파일(frontend/dist)
  - type: web
    name: timepick
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist          # rootDir(frontend) 기준
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: VITE_API_URL            # 빌드 시 코드에 들어감. 바꾸면 다시 배포해야 반영된다
        value: https://timepick-api.onrender.com
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite                # React Router(SPA): 실제 파일이 없는 경로는 index.html
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /js/config.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*              # Vite가 파일명에 해시를 붙이므로 장기 캐시 가능
        name: Cache-Control
        value: public, max-age=31536000, immutable
