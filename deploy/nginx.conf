# EC2: 프런트엔드 정적 파일 + /api, /docs, /health → FastAPI(api:8000) 프록시
# 앞단(서버 nginx·HTTPS)이 보낸 X-Forwarded-Proto를 그대로 넘긴다. 없으면 이 nginx의 scheme(http).
# 덮어쓰면 API가 OAuth 복귀 주소를 http://로 만들어 구글 로그인이 redirect_uri_mismatch로 막힌다
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 같은 도메인의 API를 쓰도록 config.js를 교체 (API_BASE_URL="/")
    location = /js/config.js {
        alias /etc/nginx/app-config.js;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(api/|docs|openapi.json|health) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    location / {
        try_files $uri $uri/ /index.html;   # React(SPA) 라우팅
    }

}
