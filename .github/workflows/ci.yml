name: CI

on:
  push:
    # main은 deploy.yml이 이 워크플로를 호출하므로 중복 실행하지 않는다
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint · pytest on SQLite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check backend
      - run: pytest -q
        working-directory: backend

  backend-mysql:
    name: Backend (pytest on MySQL 8)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: picktiming_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEST_DATABASE_URL: mysql+pymysql://ci:ci-password@127.0.0.1:3306/picktiming_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
        working-directory: backend

  rpa:
    name: RPA (lint · pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check rpa
      - run: pytest -q
        working-directory: rpa

  frontend:
    name: Frontend (React build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: "빌드 결과 확인 (데모 모드 config.js, SPA 진입점)"
        run: "test -f dist/index.html && grep -q API_BASE_URL dist/js/config.js"
      - name: "Render Static Site 빌드 확인 (VITE_API_URL 주입·정규화, 잘못된 주소 거부)"
        run: |
          VITE_API_URL="https://timepick-ai.onrender.com/" npm run build
          grep -rq "https://timepick-ai.onrender.com" dist/assets
          if grep -rq "https://timepick-ai.onrender.com/[\`\"']" dist/assets; then echo "끝의 / 가 정리되지 않았습니다"; exit 1; fi
          grep -q 'API_BASE_URL: ""' dist/js/config.js
          if VITE_API_URL="timepick-ai.onrender.com" npm run build; then echo "잘못된 VITE_API_URL이 통과했습니다"; exit 1; fi

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    needs: [backend, rpa]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t picktiming-api:ci .
      - run: docker build -f rpa/Dockerfile -t picktiming-rpa:ci .
      - name: API 컨테이너 헬스 체크
        run: |
          docker run -d --name api -p 8000:8000 -e DATABASE_URL=sqlite:////app/data/ci.db picktiming-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
      - name: Render 백엔드 구성 확인 (API 전용 + FRONTEND_URL 리다이렉트·CORS)
        run: |
          WEB=https://timepick.onrender.com
          docker run -d --name split -p 8002:8000 -e DATABASE_URL=sqlite:////app/data/ci.db \
            -e FRONTEND_URL=$WEB -e ALLOWED_ORIGINS=http://localhost:5173 picktiming-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8002/health && break; sleep 2; done
          curl -sS -o /dev/null -w '%{http_code} %{redirect_url}\n' http://localhost:8002/product/1 | grep -qx "302 $WEB/product/1" \
            && curl -sS -o /dev/null -w '%{http_code}' http://localhost:8002/api/v1/no-such-endpoint | grep -qx 404 \
            && curl -fsS -X OPTIONS -H "Origin: $WEB" -H "Access-Control-Request-Method: POST" \
                 -H "Access-Control-Request-Headers: authorization,content-type" -D - -o /dev/null \
                 http://localhost:8002/api/v1/auth/login | grep -qi "access-control-allow-origin: $WEB" \
            || { docker logs split; exit 1; }
      - name: 이전 통합 이미지(저장소 루트 Dockerfile, 롤백용) 빌드·확인
        run: |
          docker build -t picktiming-render:ci .
          docker run -d --name render -p 8001:10000 -e PORT=10000 -e DATABASE_URL=sqlite:////app/data/ci.db picktiming-render:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8001/health && break; sleep 2; done
          curl -fsS http://localhost:8001/login | grep -q "js/config.js" \
            && curl -fsS http://localhost:8001/js/config.js | grep -q 'API_BASE_URL: "/"' \
            || { docker logs render; exit 1; }
      - name: Compose 설정 검증 (.env.example을 그대로 복사해도 동작해야 함)
        run: cp .env.example .env && docker compose config -q
